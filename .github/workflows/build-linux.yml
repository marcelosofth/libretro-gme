name: Build Linux .so

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gme2
        uses: actions/checkout@v4

      - name: Instalar dependencias de build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3

      - name: Compilar libvgm (Linux)
        run: |
          cd deps/libvgm
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Compilar FluidSynth (Linux, sem drivers de audio de sistema)
        run: |
          cd deps/fluidsynth-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -Denable-alsa=0 -Denable-dbus=0 -Denable-jack=0 \
            -Denable-network=0 -Denable-oss=0 -Denable-pulseaudio=0 \
            -Denable-readline=0 -Denable-sdl2=0 -Denable-sdl3=0 \
            -Denable-libsndfile=0
          cmake --build build -j"$(nproc)"

      - name: Baixar ROMs do MT-32 (repo privado)
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.MT32_ROMS_PAT }}@github.com/marcelosofth/gme2-mt32-roms.git \
            deps/mt32rom

      - name: Gerar headers embutidos (MT-32 ROMs + SoundFonts)
        run: |
          python3 gen_mt32_inc.py
          python3 embed_soundfont.py "deps/fluidsynth-src/sf2/GeneralUser GS v1.511.sf2" src/fluid_soundfont.inc
          python3 embed_soundfont.py "deps/tsf/TimGM6mb.sf2" src/gm_soundfont.inc

      - name: Compilar o core (platform=unix)
        run: |
          make platform=unix clean
          make platform=unix -j"$(nproc)"

      - name: Publicar o .so como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gme2_libretro-linux
          path: gme2_libretro.so
          if-no-files-found: error
